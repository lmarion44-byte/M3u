<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M3U Control Center</title>

<style>
:root {
  --bg: #0b0f14;
  --surface: #111720;
  --surface-2: #171e28;
  --surface-3: #1d2632;
  --border: #2a3442;

  --text: #f2f5f8;
  --text-2: #aeb8c5;
  --text-3: #748092;

  --blue: #4da3ff;
  --green: #3bd671;
  --red: #ff5c69;
  --yellow: #ffc857;

  --radius: 14px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
input,
select {
  font: inherit;
}

.container {
  width: min(1500px, calc(100% - 30px));
  margin: 0 auto;
}

/* HEADER */

header {
  padding: 28px 0 20px;
}

.header-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: var(--blue);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
}

h1 {
  margin: 0;
  font-size: 25px;
}

.subtitle {
  margin-top: 5px;
  color: var(--text-2);
  font-size: 14px;
}

/* CARDS */

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 15px;
}

.card-title {
  font-size: 15px;
  font-weight: 900;
  margin-bottom: 12px;
}

/* INPUT */

.url-row {
  display: flex;
  gap: 10px;
}

input[type="text"],
input[type="url"],
select {
  width: 100%;
  min-height: 44px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  padding: 0 13px;
  outline: none;
}

input:focus,
select:focus {
  border-color: var(--blue);
}

button {
  min-height: 44px;
  border: 0;
  border-radius: 10px;
  padding: 0 16px;
  cursor: pointer;
  font-weight: 900;
  transition: 0.15s ease;
}

button:hover {
  filter: brightness(1.08);
}

button:active {
  transform: translateY(1px);
}

.primary {
  background: var(--blue);
  color: #06111d;
}

.secondary {
  background: var(--surface-3);
  border: 1px solid var(--border);
  color: var(--text);
}

.reset-btn {
  background: var(--surface-3);
  border: 1px solid var(--border);
  color: var(--text-2);
}

.reset-btn:hover {
  border-color: var(--red);
  color: var(--text);
}

.file-row {
  margin-top: 12px;
}

input[type="file"] {
  width: 100%;
  padding: 10px;
  border: 1px dashed var(--border);
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text-2);
}

.source {
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-3);
  word-break: break-all;
}

/* METRICS */

.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.metric {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px;
}

.metric-label {
  color: var(--text-2);
  font-size: 12px;
}

.metric-value {
  font-size: 26px;
  font-weight: 900;
  margin-top: 4px;
}

/* CHECKER */

.checker-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.checker-buttons {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.progress {
  margin-top: 14px;
  height: 9px;
  background: var(--surface-3);
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: var(--blue);
  transition: width 0.2s ease;
}

.status-text {
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-2);
}

/* COUNTERS */

.check-counters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 14px;
}

.counter {
  padding: 7px 11px;
  border-radius: 20px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 800;
}

.counter.ok {
  color: var(--green);
}

.counter.nok {
  color: var(--red);
}

.counter.cors {
  color: var(--yellow);
}

/* FILTERS */

.filters {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}

/* TABLE */

.table-card {
  padding: 0;
  overflow: hidden;
}

.table-wrapper {
  width: 100%;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 850px;
}

thead {
  background: var(--surface-2);
}

th,
td {
  text-align: left;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

th {
  font-size: 11px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

td {
  font-size: 13px;
}

.channel-name {
  font-weight: 800;
}

.channel-url {
  max-width: 450px;
  color: var(--text-3);
  word-break: break-all;
  font-size: 11px;
}

.group {
  color: var(--text-2);
  font-size: 12px;
}

/* STATUS */

.status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 9px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 900;
}

.status.pending {
  background: rgba(174,184,197,0.10);
  color: var(--text-2);
}

.status.ok {
  background: rgba(59,214,113,0.12);
  color: var(--green);
}

.status.nok {
  background: rgba(255,92,105,0.12);
  color: var(--red);
}

.status.cors {
  background: rgba(255,200,87,0.12);
  color: var(--yellow);
}

/* EMPTY */

.empty {
  padding: 55px 20px;
  text-align: center;
  color: var(--text-3);
}

/* RESPONSIVE */

@media (max-width: 850px) {

  .metrics {
    grid-template-columns: repeat(2, 1fr);
  }

  .filters {
    grid-template-columns: 1fr;
  }

  .url-row {
    flex-direction: column;
  }

  .checker-head {
    align-items: stretch;
  }

  .checker-buttons {
    width: 100%;
  }

  .checker-buttons button {
    flex: 1;
  }
}

@media (max-width: 500px) {

  .container {
    width: min(100% - 18px, 1500px);
  }

  header {
    padding-top: 18px;
  }

  h1 {
    font-size: 21px;
  }

  .card {
    padding: 13px;
  }

  .metrics {
    gap: 7px;
  }

  .metric {
    padding: 12px;
  }

  .metric-value {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="header-title">
    <div class="logo">📺</div>

    <div>
      <h1>M3U Control Center</h1>
      <div class="subtitle">
        Parser & Checker Pro
      </div>
    </div>
  </div>
</header>


<!-- SOURCE -->

<section class="card">

  <div class="card-title">
    📂 Charger une playlist M3U
  </div>

  <div class="url-row">

    <input
      type="url"
      id="m3u-url"
      placeholder="https://exemple.com/playlist.m3u"
      autocomplete="off"
    >

    <button
      class="primary"
      id="btn-load-url"
      type="button">
      Charger
    </button>

  </div>

  <div class="file-row">

    <input
      type="file"
      id="m3u-file"
      accept=".m3u,.m3u8,.txt"
    >

  </div>

  <div
    class="source"
    id="loaded-source">
  </div>

</section>


<!-- METRICS -->

<section class="card">

  <div class="card-title">
    📊 Statistiques
  </div>

  <div class="metrics">

    <div class="metric">
      <div class="metric-label">
        Total chaînes
      </div>
      <div
        class="metric-value"
        id="metric-total">
        0
      </div>
    </div>

    <div class="metric">
      <div class="metric-label">
        Live
      </div>
      <div
        class="metric-value"
        id="metric-live">
        0
      </div>
    </div>

    <div class="metric">
      <div class="metric-label">
        VOD
      </div>
      <div
        class="metric-value"
        id="metric-vod">
        0
      </div>
    </div>

    <div class="metric">
      <div class="metric-label">
        Groupes
      </div>
      <div
        class="metric-value"
        id="metric-groups">
        0
      </div>
    </div>

  </div>

</section>


<!-- CHECKER -->

<section class="card">

  <div class="checker-head">

    <div class="card-title" style="margin-bottom:0">
      ⚡ Vérification des chaînes
    </div>

    <div class="checker-buttons">

      <button
        class="primary"
        id="btn-check-all"
        type="button">
        ⚡ Tout vérifier en 1 clic
      </button>

      <button
        class="reset-btn"
        id="btn-reset"
        type="button">
        ↺ Reset
      </button>

    </div>

  </div>


  <div class="progress">

    <div
      class="progress-bar"
      id="checker-progress-bar">
    </div>

  </div>

  <div
    class="status-text"
    id="checker-status-text">
    Aucune vérification en cours
  </div>


  <div class="check-counters">

    <div class="counter ok">
      🟢 OK :
      <span id="count-ok">0</span>
    </div>

    <div class="counter nok">
      🔴 NOK :
      <span id="count-nok">0</span>
    </div>

    <div class="counter cors">
      🟡 Accès refusé :
      <span id="count-cors">0</span>
    </div>

  </div>

</section>


<!-- FILTERS -->

<section class="card">

  <div class="filters">

    <input
      type="text"
      id="search"
      placeholder="🔎 Rechercher une chaîne..."
      autocomplete="off"
    >

    <select id="group-filter">
      <option value="">
        Toutes les catégories
      </option>
    </select>

  </div>

</section>


<!-- TABLE -->

<section class="card table-card">

  <div class="table-wrapper">

    <table>

      <thead>

        <tr>
          <th>#</th>
          <th>Chaîne</th>
          <th>Groupe</th>
          <th>Type</th>
          <th>URL</th>
          <th>Statut</th>
        </tr>

      </thead>

      <tbody id="channels-tbody">

      </tbody>

    </table>

    <div
      class="empty"
      id="empty-state">
      Charge une playlist M3U pour commencer.
    </div>

  </div>

</section>

</div>


<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

const PROXY_URL =
  "https://m3u-cors-proxy.lmarion44.workers.dev/?url=";

const CHECK_URL =
  "https://m3u-cors-proxy.lmarion44.workers.dev/check?url=";


/* =========================================================
   ETAT GLOBAL
   ========================================================= */

let channelsData = [];

let activeCheckingBatch = false;

/*
 * Contrôleur permettant d'annuler les fetch()
 * lorsque l'utilisateur clique sur RESET.
 */
let checkAbortController = null;

/*
 * Numéro de génération.
 *
 * Si une ancienne vérification revient après RESET,
 * elle sera ignorée.
 */
let checkGeneration = 0;


/* =========================================================
   ELEMENTS DOM
   ========================================================= */

const urlInput =
  document.getElementById("m3u-url");

const fileInput =
  document.getElementById("m3u-file");

const searchInput =
  document.getElementById("search");

const groupFilter =
  document.getElementById("group-filter");

const tbody =
  document.getElementById("channels-tbody");

const emptyState =
  document.getElementById("empty-state");

const btnLoadUrl =
  document.getElementById("btn-load-url");

const btnCheckAll =
  document.getElementById("btn-check-all");

const btnReset =
  document.getElementById("btn-reset");

const progressBar =
  document.getElementById("checker-progress-bar");

const statusText =
  document.getElementById("checker-status-text");


/* =========================================================
   URL PROXY
   ========================================================= */

function proxiedUrl(url) {

  return (
    PROXY_URL +
    encodeURIComponent(url)
  );

}


/* =========================================================
   ECHAPPEMENT HTML
   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   PARSE M3U
   ========================================================= */

function parseM3U(text) {

  const lines =
    text
      .replace(/\r/g, "")
      .split("\n");

  const channels = [];

  let currentInfo = null;

  for (let i = 0; i < lines.length; i++) {

    const line =
      lines[i].trim();

    if (!line) {
      continue;
    }


    /*
     * Ligne EXTINF
     */

    if (
      line.startsWith("#EXTINF")
    ) {

      const comma =
        line.indexOf(",");

      let displayName = "";

      if (comma >= 0) {
        displayName =
          line
            .substring(comma + 1)
            .trim();
      }

      const tvgName =
        getAttribute(
          line,
          "tvg-name"
        );

      const groupTitle =
        getAttribute(
          line,
          "group-title"
        );

      const tvgId =
        getAttribute(
          line,
          "tvg-id"
        );

      const logo =
        getAttribute(
          line,
          "tvg-logo"
        );

      currentInfo = {
        name:
          tvgName ||
          displayName ||
          "Sans nom",

        group:
          groupTitle ||
          "Sans catégorie",

        tvgId:
          tvgId || "",

        logo:
          logo || ""
      };

      continue;
    }


    /*
     * Ligne URL
     */

    if (
      !line.startsWith("#") &&
      currentInfo
    ) {

      const url =
        line;

      const type =
        detectType(
          currentInfo.group,
          currentInfo.name
        );

      channels.push({

        id:
          channels.length + 1,

        name:
          currentInfo.name,

        group:
          currentInfo.group,

        tvgId:
          currentInfo.tvgId,

        logo:
          currentInfo.logo,

        url:

          url,

        type:
          type,

        status:
          "pending"

      });

      currentInfo = null;
    }

  }

  return channels;
}


/* =========================================================
   EXTRACTION ATTRIBUT
   ========================================================= */

function getAttribute(
  line,
  attribute
) {

  const regex =
    new RegExp(
      attribute +
      '="([^"]*)"',
      "i"
    );

  const match =
    line.match(regex);

  if (match) {
    return match[1];
  }

  return "";

}


/* =========================================================
   TYPE
   ========================================================= */

function detectType(
  group,
  name
) {

  const text =
    (
      (group || "") +
      " " +
      (name || "")
    ).toLowerCase();

  const vodWords = [
    "vod",
    "movie",
    "film",
    "films",
    "series",
    "série",
    "episode",
    "épisode"
  ];

  for (const word of vodWords) {

    if (text.includes(word)) {
      return "VOD";
    }

  }

  return "LIVE";
}


/* =========================================================
   CHARGER M3U DEPUIS URL
   ========================================================= */

async function loadFromUrl() {

  const url =
    urlInput.value.trim();

  if (!url) {

    alert(
      "Veuillez saisir une URL M3U."
    );

    return;
  }


  btnLoadUrl.disabled = true;

  btnLoadUrl.textContent =
    "Chargement...";


  try {

    let response;

    /*
     * Tentative directe
     */

    try {

      response =
        await fetch(
          url,
          {
            method: "GET",
            cache: "no-store"
          }
        );

    } catch (error) {

      response = null;

    }


    /*
     * Si CORS bloqué :
     * passage par Cloudflare
     */

    if (
      !response ||
      !response.ok
    ) {

      response =
        await fetch(
          proxiedUrl(url),
          {
            method: "GET",
            cache: "no-store"
          }
        );

    }


    if (!response.ok) {

      throw new Error(
        "Impossible de charger la playlist."
      );

    }


    const text =
      await response.text();


    loadPlaylistText(
      text,
      url
    );


  } catch (error) {

    console.error(error);

    alert(
      "Erreur lors du chargement de la playlist :\n\n" +
      error.message
    );

  } finally {

    btnLoadUrl.disabled = false;

    btnLoadUrl.textContent =
      "Charger";

  }

}


/* =========================================================
   CHARGER FICHIER LOCAL
   ========================================================= */

fileInput.addEventListener(
  "change",
  async function() {

    const file =
      fileInput.files[0];

    if (!file) {
      return;
    }

    try {

      const text =
        await file.text();

      loadPlaylistText(
        text,
        file.name
      );

    } catch (error) {

      alert(
        "Impossible de lire le fichier."
      );

    }

  }
);


/* =========================================================
   CHARGER TEXTE M3U
   ========================================================= */

function loadPlaylistText(
  text,
  source
) {

  /*
   * Annule une ancienne vérification
   * avant de charger une nouvelle playlist.
   */

  cancelChecking();

  channelsData =
    parseM3U(text);


  document.getElementById(
    "loaded-source"
  ).textContent =
    "Source : " + source;


  updateGroupFilter();

  updateMetrics();

  renderTable();

  progressBar.style.width =
    "0%";

  statusText.textContent =
    `${channelsData.length} chaîne(s) chargée(s).`;

}


/* =========================================================
   GROUPES
   ========================================================= */

function updateGroupFilter() {

  const groups =
    [...new Set(
      channelsData
        .map(channel => channel.group)
        .filter(Boolean)
    )]
    .sort(
      (a, b) =>
        a.localeCompare(b)
    );


  groupFilter.innerHTML =
    '<option value="">Toutes les catégories</option>';


  groups.forEach(group => {

    const option =
      document.createElement("option");

    option.value =
      group;

    option.textContent =
      group;

    groupFilter.appendChild(
      option
    );

  });

}


/* =========================================================
   METRICS
   ========================================================= */

function updateMetrics() {

  const total =
    channelsData.length;

  const live =
    channelsData.filter(
      c => c.type === "LIVE"
    ).length;

  const vod =
    channelsData.filter(
      c => c.type === "VOD"
    ).length;

  const groups =
    new Set(
      channelsData
        .map(c => c.group)
        .filter(Boolean)
    ).size;


  document.getElementById(
    "metric-total"
  ).textContent =
    total;

  document.getElementById(
    "metric-live"
  ).textContent =
    live;

  document.getElementById(
    "metric-vod"
  ).textContent =
    vod;

  document.getElementById(
    "metric-groups"
  ).textContent =
    groups;


  updateStatusCounters();

}


/* =========================================================
   COMPTEURS STATUT
   ========================================================= */

function updateStatusCounters() {

  const ok =
    channelsData.filter(
      c => c.status === "ok"
    ).length;

  const nok =
    channelsData.filter(
      c => c.status === "nok"
    ).length;

  const cors =
    channelsData.filter(
      c => c.status === "cors"
    ).length;


  document.getElementById(
    "count-ok"
  ).textContent =
    ok;

  document.getElementById(
    "count-nok"
  ).textContent =
    nok;

  document.getElementById(
    "count-cors"
  ).textContent =
    cors;

}


/* =========================================================
   FILTRAGE
   ========================================================= */

function getFilteredChannels() {

  const search =
    searchInput.value
      .trim()
      .toLowerCase();

  const group =
    groupFilter.value;


  return channelsData.filter(
    channel => {

      const matchesSearch =
        !search ||
        channel.name
          .toLowerCase()
          .includes(search) ||
        channel.url
          .toLowerCase()
          .includes(search) ||
        channel.group
          .toLowerCase()
          .includes(search);


      const matchesGroup =
        !group ||
        channel.group === group;


      return (
        matchesSearch &&
        matchesGroup
      );

    }
  );

}


/* =========================================================
   RENDU TABLEAU
   ========================================================= */

function renderTable() {

  const filtered =
    getFilteredChannels();


  tbody.innerHTML = "";


  if (
    channelsData.length === 0
  ) {

    emptyState.style.display =
      "block";

    updateStatusCounters();

    return;

  }


  emptyState.style.display =
    filtered.length === 0
      ? "block"
      : "none";


  filtered.forEach(
    (channel, index) => {

      const tr =
        document.createElement("tr");


      let statusHtml = "";


      if (
        channel.status === "ok"
      ) {

        statusHtml =
          `<span class="status ok">
             🟢 OK
           </span>`;

      } else if (
        channel.status === "nok"
      ) {

        statusHtml =
          `<span class="status nok">
             🔴 NOK
           </span>`;

      } else if (
        channel.status === "cors"
      ) {

        statusHtml =
          `<span class="status cors">
             🟡 Accès refusé
           </span>`;

      } else {

        statusHtml =
          `<span class="status pending">
             ⚪ En attente
           </span>`;

      }


      tr.innerHTML = `

        <td>
          ${index + 1}
        </td>

        <td>
          <div class="channel-name">
            ${escapeHtml(channel.name)}
          </div>
        </td>

        <td>
          <div class="group">
            ${escapeHtml(channel.group)}
          </div>
        </td>

        <td>
          ${escapeHtml(channel.type)}
        </td>

        <td>
          <div class="channel-url">
            ${escapeHtml(channel.url)}
          </div>
        </td>

        <td>
          ${statusHtml}
        </td>

      `;


      tbody.appendChild(tr);

    }
  );


  updateStatusCounters();

}


/* =========================================================
   VERIFICATION D'UNE URL
   ========================================================= */

async function verifyUrlNetwork(
  url,
  signal
) {

  try {

    const response =
      await fetch(
        CHECK_URL +
        encodeURIComponent(url),
        {
          method: "GET",
          cache: "no-store",
          signal: signal
        }
      );


    /*
     * Si Cloudflare renvoie une erreur HTTP
     */

    if (!response.ok) {
      return "nok";
    }


    const data =
      await response.json();


    /*
     * Serveur joignable + flux considéré OK
     */

    if (
      data.online === true
    ) {

      return "ok";

    }


    /*
     * Serveur joignable mais accès refusé
     * (401 / 403 par exemple)
     */

    if (
      data.reachable === true
    ) {

      return "cors";

    }


    return "nok";


  } catch (error) {

    /*
     * IMPORTANT :
     * AbortError = Reset.
     *
     * On ne transforme surtout pas
     * l'annulation en NOK.
     */

    if (
      error.name === "AbortError"
    ) {

      return "aborted";

    }


    return "nok";

  }

}


/* =========================================================
   VERIFIER TOUT
   ========================================================= */

async function checkAllChannels() {

  if (
    channelsData.length === 0
  ) {

    alert(
      "Aucune chaîne à vérifier."
    );

    return;

  }


  /*
   * Nouvelle génération
   */

  const myGeneration =
    ++checkGeneration;


  /*
   * Annule une ancienne session
   */

  if (
    checkAbortController
  ) {

    checkAbortController.abort();

  }


  /*
   * Nouveau contrôleur
   */

  checkAbortController =
    new AbortController();


  const signal =
    checkAbortController.signal;


  activeCheckingBatch =
    true;


  btnCheckAll.disabled =
    true;


  btnReset.disabled =
    false;


  progressBar.style.width =
    "0%";


  statusText.textContent =
    "Démarrage de la vérification...";


  try {

    const total =
      channelsData.length;


    for (
      let i = 0;
      i < total;
      i++
    ) {


      /*
       * VERIFICATION CRITIQUE
       *
       * Si RESET a été utilisé,
       * l'ancienne boucle s'arrête.
       */

      if (
        !activeCheckingBatch ||
        signal.aborted ||
        myGeneration !== checkGeneration
      ) {

        return;

      }


      const channel =
        channelsData[i];


      channel.status =
        "pending";


      renderTable();


      /*
       * Vérification serveur
       */

      const result =
        await verifyUrlNetwork(
          channel.url,
          signal
        );


      /*
       * RESET pendant l'attente
       *
       * Ne surtout PAS modifier channel.
       */

      if (
        !activeCheckingBatch ||
        signal.aborted ||
        myGeneration !== checkGeneration
      ) {

        return;

      }


      /*
       * Si le fetch a été annulé
       */

      if (
        result === "aborted"
      ) {

        return;

      }


      channel.status =
        result;


      const progress =
        Math.round(
          ((i + 1) / total) * 100
        );


      progressBar.style.width =
        progress + "%";


      statusText.textContent =
        `Vérification : ${i + 1} / ${total}`;


      renderTable();

    }


  } catch (error) {

    /*
     * Abort = Reset normal
     */

    if (
      error.name === "AbortError"
    ) {

      return;

    }


    console.error(
      "Erreur vérification :",
      error
    );


  } finally {

    /*
     * Très important :
     * ne pas modifier l'interface si
     * une nouvelle session existe.
     */

    if (
      myGeneration === checkGeneration
    ) {

      activeCheckingBatch =
        false;

      checkAbortController =
        null;

      btnCheckAll.disabled =
        false;

      statusText.textContent =
        "Vérification terminée";

    }

  }

}


/* =========================================================
   ANNULER LES VERIFICATIONS
   ========================================================= */

function cancelChecking() {

  /*
   * Invalide immédiatement
   * l'ancienne génération.
   */

  checkGeneration++;


  /*
   * Arrête la boucle.
   */

  activeCheckingBatch =
    false;


  /*
   * Annule les fetch().
   */

  if (
    checkAbortController
  ) {

    try {

      checkAbortController.abort();

    } catch (error) {

      console.warn(
        error
      );

    }

    checkAbortController =
      null;

  }


  if (btnCheckAll) {

    btnCheckAll.disabled =
      false;

  }

}


/* =========================================================
   RESET COMPLET
   ========================================================= */

function resetAll() {

  console.log(
    "RESET COMPLET demandé"
  );


  /*
   * ======================================================
   * 1. INVALIDER IMMEDIATEMENT toutes les anciennes
   *    vérifications
   * ======================================================
   */

  checkGeneration++;


  /*
   * ======================================================
   * 2. ANNULER TOUS LES FETCH EN COURS
   * ======================================================
   */

  if (
    checkAbortController
  ) {

    try {

      checkAbortController.abort();

    } catch (error) {

      console.warn(
        "Erreur annulation :",
        error
      );

    }

    checkAbortController =
      null;

  }


  /*
   * ======================================================
   * 3. ARRÊTER LA BOUCLE
   * ======================================================
   */

  activeCheckingBatch =
    false;


  /*
   * ======================================================
   * 4. VIDER LES DONNEES
   * ======================================================
   */

  channelsData =
    [];


  /*
   * ======================================================
   * 5. VIDER URL
   * ======================================================
   */

  if (urlInput) {

    urlInput.value =
      "";

  }


  /*
   * ======================================================
   * 6. VIDER FICHIER
   * ======================================================
   */

  if (fileInput) {

    fileInput.value =
      "";

  }


  /*
   * ======================================================
   * 7. VIDER RECHERCHE
   * ======================================================
   */

  if (searchInput) {

    searchInput.value =
      "";

  }


  /*
   * ======================================================
   * 8. RESET FILTRE
   * ======================================================
   */

  if (groupFilter) {

    groupFilter.innerHTML =
      '<option value="">Toutes les catégories</option>';

  }


  /*
   * ======================================================
   * 9. VIDER TABLEAU
   * ======================================================
   */

  if (tbody) {

    tbody.innerHTML =
      "";

  }


  /*
   * ======================================================
   * 10. REMETTRE LES COMPTEURS À ZERO
   * ======================================================
   */

  document.getElementById(
    "metric-total"
  ).textContent = "0";

  document.getElementById(
    "metric-live"
  ).textContent = "0";

  document.getElementById(
    "metric-vod"
  ).textContent = "0";

  document.getElementById(
    "metric-groups"
  ).textContent = "0";

  document.getElementById(
    "count-ok"
  ).textContent = "0";

  document.getElementById(
    "count-nok"
  ).textContent = "0";

  document.getElementById(
    "count-cors"
  ).textContent = "0";


  /*
   * ======================================================
   * 11. RESET PROGRESSION
   * ======================================================
   */

  if (progressBar) {

    progressBar.style.width =
      "0%";

  }


  /*
   * ======================================================
   * 12. RESET MESSAGE
   * ======================================================
   */

  if (statusText) {

    statusText.textContent =
      "Aucune vérification en cours";

  }


  /*
   * ======================================================
   * 13. EFFACER SOURCE
   * ======================================================
   */

  const source =
    document.getElementById(
      "loaded-source"
    );

  if (source) {

    source.textContent =
      "";

  }


  /*
   * ======================================================
   * 14. REACTIVER BOUTON
   * ======================================================
   */

  if (btnCheckAll) {

    btnCheckAll.disabled =
      false;

  }


  /*
   * ======================================================
   * 15. AFFICHER MESSAGE VIDE
   * ======================================================
   */

  if (emptyState) {

    emptyState.style.display =
      "block";

  }


  console.log(
    "RESET COMPLET terminé"
  );

}


/* =========================================================
   EVENEMENTS
   ========================================================= */

btnLoadUrl.addEventListener(
  "click",
  loadFromUrl
);


btnCheckAll.addEventListener(
  "click",
  checkAllChannels
);


btnReset.addEventListener(
  "click",
  resetAll
);


searchInput.addEventListener(
  "input",
  renderTable
);


groupFilter.addEventListener(
  "change",
  renderTable
);

 */

urlInput.addEventListener(
  "keydown",

    if (
      event.key === "Enter"
    ) {

      loadFromUrl();

    }

  }
);


/* =========================================================
   INITIALISATION
   ========================================================= */

renderTable();

</script>
